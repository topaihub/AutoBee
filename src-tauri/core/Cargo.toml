[package]
name = "route-core"
version = "0.1.0"
description = "路线规划的 provider 抽象层、归一化模型与坐标系换算（不依赖 Tauri）"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

# blocking + rustls：算路是一次请求等一次响应，没必要引 async 传染整条调用链
# （调用方是 Tauri command，它会自己丢到阻塞线程池）。rustls 免去对系统
# OpenSSL 的依赖，单 exe 分发更省事。
# json 必须显式开：关掉 default-features 之后 Response::json() 就不存在了，
# 而报出来的错是「no method named json」，看不出是 feature 没开。
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
missing_errors_doc = "warn"

