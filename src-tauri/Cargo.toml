[workspace]
# core 独立成 crate 的理由：它不依赖 Tauri，`cargo test -p route-core` 能在
# 几十秒内跑完，而带上 tauri 的一次完整编译要十几分钟。算路、坐标系、解码这些
# 逻辑的回归主要靠单测，不该被 GUI 依赖的编译时间拖住。
# shell 拆出来的理由不同：它是 GUI 与 CLI 的公共底座（凭据、日志、路径），
# 两个 bin 都要用。留在根包里的话 CLI 就得依赖 tauri 才能读到密钥。
# cli 是第三个 crate 而不是根包的第二个 bin:bin 会继承根包的 tauri 依赖。
members = ["core", "shell", "cli"]
resolver = "2"

[package]
name = "autobee"
version = "0.1.0"
description = "AutoBee 桌面路线规划（Tauri + 纯 Rust 后端）"
authors = ["AutoBee"]
edition = "2024"

[lib]
# `_lib` 后缀看着多余，但在 Windows 上必须与 bin 名区分开。
# 见 https://github.com/rust-lang/cargo/issues/8519
name = "route_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
route-core = { path = "core" }

# 凭据、日志、路径。根包只剩 command 层，这些都在 shell 里。
autobee-shell = { path = "shell" }

# 插件版本写精确值而不是 "2"。原因同 ai-installer：Rust crate 与 npm 包是两半，
# `tauri build` 会校验两边的 major/minor，写 "2" 时两边会各自漂开。
tauri = { version = "2.11.5", features = [] }

tracing = "0.1"

# 瓦片以 base64 下发：IPC 的 JSON  serializer 会把 Vec<u8> 变成数字数组
# （3 KB 的图会膨胀成十几 KB 的文本），而 base64 只多三分之一。
base64 = "0.22"

tauri-plugin-opener = "^2"

[lints.clippy]
# 桌面工具跑在别人机器上，panic 等于闪退无日志。测试代码在模块里单独 allow。
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "deny"
missing_errors_doc = "warn"

[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
